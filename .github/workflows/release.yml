name: Public build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Build for Apple Silicon
        run: swift build --configuration release --triple arm64-apple-macosx

      - name: Build for Intel
        run: swift build --configuration release --triple x86_64-apple-macosx

      - name: Verify universal binary
        run: |
          lipo -create \
            .build/arm64-apple-macosx/release/Typemore \
            .build/x86_64-apple-macosx/release/Typemore \
            -output /tmp/Typemore-universal
          lipo /tmp/Typemore-universal -verify_arch arm64 x86_64
